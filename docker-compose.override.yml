# docker-compose.override.yml
# SearXNG 集成配置 - 不修改主 docker-compose.yaml
# 此文件会自动与 docker-compose.yaml 合并

services:
  searxng:
    build: ./searxng
    image: firecrawl-searxng:latest
    container_name: firecrawl-searxng-1
    environment:
      BASE_URL: http://searxng:8080/
      INSTANCE_NAME: SearXNG-Firecrawl
      # 可选代理: PROXY_SERVER 为空时不起作用 (走透明代理), 设置后显式走代理
      HTTP_PROXY: ${PROXY_SERVER:-}
      HTTPS_PROXY: ${PROXY_SERVER:-}
      NO_PROXY: localhost,127.0.0.1,searxng,api,redis,playwright-service,nuq-postgres
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"
    restart: unless-stopped

  api:
    depends_on:
      redis:
        condition: service_started
      playwright-service:
        condition: service_started
      searxng:
        condition: service_healthy
